<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#eaf2ea">
<title>Miau &amp; Au</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- app -->
<main class="app">
  <header class="top">
    <h1><span class="c">Miau</span> <span class="amp">&amp;</span> <span class="d">Au</span></h1>
    <div class="scores">
      <div class="score"><span>Pontos</span><b id="score">0</b></div>
      <div class="score"><span>Recorde</span><b id="best">0</b></div>
    </div>
  </header>
  <p class="hint">Arraste para mirar e solte. Dois bichos iguais que se encostam viram um maior.</p>

  <div class="stage">
    <canvas id="canvas" tabindex="0" aria-label="Quintal: arraste para mirar e solte, ou use as setas e a barra de espaço"></canvas>
    <div class="next" aria-hidden="true"><span>Próximo</span><div id="next"></div></div>
    <div class="overlay" id="over" hidden>
      <h2>O quintal lotou</h2>
      <p>Você fez <b id="final">0</b> pontos. Jogar de novo com:</p>
      <div class="pick">
        <button class="primary" type="button" data-kind="cat">Gatos</button>
        <button class="primary" type="button" data-kind="dog">Cachorros</button>
      </div>
    </div>
  </div>

  <nav class="actions">
    <button id="new" type="button">Novo jogo</button>
    <button id="album-btn" type="button">Álbum</button>
  </nav>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<dialog id="album" aria-labelledby="album-title">
  <div class="dialog-head">
    <h2 id="album-title">Álbum</h2>
    <button id="album-close" type="button">Fechar</button>
  </div>
  <h3 class="c">Gatos</h3>
  <ul class="album" id="album-cat"></ul>
  <h3 class="d">Cachorros</h3>
  <ul class="album" id="album-dog"></ul>
</dialog>

<dialog id="chooser" aria-labelledby="chooser-title">
  <div class="dialog-head">
    <h2 id="chooser-title">Novo jogo</h2>
    <button id="chooser-close" type="button">Cancelar</button>
  </div>
  <p>A partida atual será apagada. Jogar com:</p>
  <div class="pick">
    <button class="primary" type="button" data-kind="cat">Gatos</button>
    <button class="primary" type="button" data-kind="dog">Cachorros</button>
  </div>
</dialog>

<script type="module" src="js/main.js"></script>
<!-- /app -->
</body>
</html>
